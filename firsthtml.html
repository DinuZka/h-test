<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group Idea Board</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4ec);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin: 15px 0;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-clear {
      background: #f44336;
      color: #fff;
    }
    .btn-clear:hover {
      background: #d32f2f;
    }
    .btn-add {
      background: #4CAF50;
      color: #fff;
    }
    .btn-add:hover {
      background: #388E3C;
    }
    .ideas {
      margin-top: 20px;
    }
    .idea-card {
      background: #f9f9f9;
      border-left: 5px solid #4CAF50;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Group Idea Board</h1>
    <p style="text-align:center;">Share and collect ideas from your team!</p>
    
    <div class="form-group">
      <label for="name">Select your name:</label>
      <select id="name">
        <option>Bob</option>
        <option>Sara</option>
        <option>Alex</option>
        <option>Nimal</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="idea">Enter your idea here:</label>
      <input type="text" id="idea" placeholder="Type your idea...">
    </div>
    
    <div class="buttons">
      <button class="btn btn-clear" onclick="document.getElementById('idea').value=''">Clear</button>
      <button class="btn btn-add" onclick="addIdea()">Add Idea</button>
    </div>
    
    <div class="ideas" id="ideas">
      <h3>Ideas:</h3>
    </div>
    
    <footer>
      © 2026 Group Idea Board. Powered by AI.
    </footer>
  </div>
  
  <script>
    function addIdea() {
      const name = document.getElementById('name').value;
      const idea = document.getElementById('idea').value;
      if(idea.trim() !== "") {
        const ideaList = document.getElementById('ideas');
        const card = document.createElement('div');
        card.className = "idea-card";
        card.textContent = idea + " – suggested by " + name;
        ideaList.appendChild(card);
        document.getElementById('idea').value = "";
      }
    }
  </script>
</body>
</html>
